<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصروفي - إدارة مصروف الأولاد</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F294A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F9;
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;
  --ink:#0F172A;
  --muted:#64748B;
  --line:#E2E8F0;
  --brand-dark:#0F294A;
  --brand-mid:#1D4ED8;
  --gold:#F59E0B;
  --accent:#2563EB;
  --accent-hover:#1D4ED8;
  --good:#059669;
  --good-bg:#ECFDF5;
  --good-border:#A7F3D0;
  --bad:#DC2626;
  --bad-bg:#FEF2F2;
  --bad-border:#FECACA;
  --warn:#D97706;
  --shadow-sm:0 2px 8px rgba(15,23,42,.04);
  --shadow-md:0 10px 28px rgba(15,23,42,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090E1A;
    --surface:#111827;
    --surface-2:#192234;
    --ink:#F1F5F9;
    --muted:#94A3B8;
    --line:#243046;
    --accent:#3B82F6;
    --accent-hover:#60A5FA;
    --good:#10B981;
    --good-bg:rgba(16,185,129,.12);
    --good-border:rgba(16,185,129,.28);
    --bad:#F87171;
    --bad-bg:rgba(248,113,113,.12);
    --bad-border:rgba(248,113,113,.28);
    --warn:#FBBF24;
    --shadow-sm:0 4px 12px rgba(0,0,0,.22);
    --shadow-md:0 14px 34px rgba(0,0,0,.38);
  }
}
:root[data-theme="dark"]{
  --bg:#090E1A;
  --surface:#111827;
  --surface-2:#192234;
  --ink:#F1F5F9;
  --muted:#94A3B8;
  --line:#243046;
  --accent:#3B82F6;
  --accent-hover:#60A5FA;
  --good:#10B981;
  --good-bg:rgba(16,185,129,.12);
  --good-border:rgba(16,185,129,.28);
  --bad:#F87171;
  --bad-bg:rgba(248,113,113,.12);
  --bad-border:rgba(248,113,113,.28);
  --warn:#FBBF24;
  --shadow-sm:0 4px 12px rgba(0,0,0,.22);
  --shadow-md:0 14px 34px rgba(0,0,0,.38);
}

html{
  box-sizing:border-box;
  scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
  color:var(--ink);
  font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
  font-size:15.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:920px;margin:0 auto;padding:22px 16px 80px}

header{
  background:linear-gradient(135deg,#0F294A 0%,#1E40AF 60%,#2563EB 100%);
  color:#fff;
  border-radius:26px;
  padding:26px 24px;
  margin-bottom:18px;
  box-shadow:0 16px 36px rgba(15,41,74,.28);
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  position:absolute;
  top:-40%;left:-10%;
  width:260px;height:260px;
  background:radial-gradient(circle,rgba(245,158,11,.22),transparent 70%);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:15px;position:relative;z-index:1}
.brand-icon{
  width:56px;height:56px;border-radius:18px;background:#fff;
  display:grid;place-items:center;flex:none;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
}
header h1{margin:0 0 2px;font-size:29px;font-weight:900;line-height:1.25}
header p{margin:0;opacity:.9;font-size:14.5px;font-weight:500}

.totals{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  margin-top:22px;position:relative;z-index:1;
}
.totals>div{
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  padding:13px 15px;
  backdrop-filter:blur(6px);
}
.totals small{display:block;opacity:.88;font-size:13px;font-weight:600;margin-bottom:2px}
.totals b{font-size:21px;font-weight:800;letter-spacing:.2px}

.toolbar{
  display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  margin-bottom:18px;
}
.toolbar .spacer{flex:1 1 auto}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow-md);
}
.panel h2{
  margin:0 0 14px;font-size:18.5px;font-weight:800;
  display:flex;align-items:center;gap:8px;
}
.row{display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:12px;align-items:end}
label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
input,select{
  width:100%;font:inherit;font-size:15px;font-weight:600;
  padding:11px 14px;min-height:46px;
  border:1.5px solid var(--line);border-radius:14px;
  background:var(--surface-2);color:var(--ink);
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
input::placeholder{color:var(--muted);opacity:.72;font-weight:500}
input:focus,select:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3.5px rgba(59,130,246,.2);
  background:var(--surface);
}
button:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

button{
  font:inherit;font-size:14.5px;font-weight:700;
  cursor:pointer;border:0;border-radius:14px;
  padding:10px 18px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .12s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease;
  user-select:none;
}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}

.primary{
  background:linear-gradient(135deg,#2563EB,#1D4ED8);
  color:#fff;
  box-shadow:0 6px 16px rgba(37,99,235,.28);
}
.primary:hover{box-shadow:0 8px 20px rgba(37,99,235,.38)}

.ghost{
  background:var(--surface);
  color:var(--ink);
  border:1.5px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.ghost:hover{border-color:var(--accent);background:var(--surface-2)}

.soft-btn{
  background:var(--surface-2);
  color:var(--ink);
  border:1.5px solid var(--line);
}
.soft-btn:hover{border-color:var(--accent)}

.green{
  background:linear-gradient(135deg,#10B981,#059669);
  color:#fff;
  box-shadow:0 6px 16px rgba(16,185,129,.26);
}
.green:hover{box-shadow:0 8px 20px rgba(16,185,129,.36)}

.red{
  background:linear-gradient(135deg,#EF4444,#DC2626);
  color:#fff;
  box-shadow:0 6px 16px rgba(220,38,38,.25);
}
.red:hover{box-shadow:0 8px 20px rgba(220,38,38,.35)}

.icon-btn{
  background:var(--surface-2);
  color:var(--muted);
  border:1px solid var(--line);
  padding:6px 12px;min-height:36px;
  font-size:13px;border-radius:11px;
}
.icon-btn:hover{color:var(--ink);border-color:var(--accent)}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad-border);background:var(--bad-bg)}

.search-bar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  margin-bottom:16px;
}
.search-bar input{flex:1 1 240px;background:var(--surface)}
.search-bar select{flex:0 1 210px;background:var(--surface)}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow-md);
  transition:border-color .2s ease;
}
.card:hover{border-color:rgba(59,130,246,.35)}
.top{display:flex;align-items:center;gap:14px}
.av{
  width:56px;height:56px;border-radius:18px;
  display:grid;place-items:center;color:#fff;
  font-size:24px;font-weight:900;flex:none;
  box-shadow:0 6px 16px rgba(0,0,0,.16);
}
.top-info{min-width:0;flex:1}
.top h3{margin:0;font-size:20.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top span{color:var(--muted);font-size:13.5px;font-weight:600;display:block}
.top-actions{display:flex;gap:6px;flex-shrink:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 14px}
.stats>div{
  background:var(--surface-2);
  border-radius:16px;
  padding:11px 13px;
  border:1px solid var(--line);
}
.stats small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:2px}
.stats b{font-size:17.5px;font-weight:800}

.bar-wrap{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:11px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s ease,background-color .3s ease}
.pct-label{font-size:13px;font-weight:800;color:var(--muted);min-width:44px;text-align:end}

.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.acts button{flex:1 1 160px}

details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
summary{
  cursor:pointer;color:var(--accent);font-weight:800;font-size:14.5px;
  list-style:none;display:flex;align-items:center;justify-content:space-between;
  padding:4px 0;
}
summary::-webkit-details-marker{display:none}
.log-controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.log-controls select{width:auto;min-height:38px;padding:6px 12px;font-size:13.5px;border-radius:11px}

.log{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 8px;border-bottom:1px dashed var(--line);font-size:14.5px;
  border-radius:10px;
}
.log:hover{background:var(--surface-2)}
.log:last-child{border-bottom:0}
.log-main{min-width:0;flex:1}
.log-title{display:block;font-weight:700}
.log-date{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.log-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.log-del{
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
  padding:4px 9px;min-height:30px;font-size:12px;border-radius:9px;
}
.log-del:hover{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-border)}

.in{color:var(--good);font-weight:800}
.out{color:var(--bad);font-weight:800}
.empty{
  text-align:center;color:var(--muted);padding:44px 18px;
  background:var(--surface);border:1.5px dashed var(--line);
  border-radius:24px;font-weight:600;
}

dialog{
  border:1px solid var(--line);border-radius:24px;padding:24px;
  width:min(410px,92vw);background:var(--surface);color:var(--ink);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}
dialog::backdrop{background:rgba(9,14,26,.65);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 14px;font-size:20px;font-weight:800}
dialog p.sub{margin:-6px 0 16px;font-size:14px;color:var(--muted);font-weight:600}
dialog .f{margin-bottom:13px}
dialog .btns{display:flex;gap:10px;margin-top:18px}
dialog .btns button{flex:1}

.toast-wrap{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  width:min(390px,90vw);
}
.toast{
  background:var(--ink);color:var(--surface);
  padding:12px 18px;border-radius:15px;font-size:14px;font-weight:700;
  box-shadow:0 12px 28px rgba(0,0,0,.28);text-align:center;
  animation:popIn .2s ease;
}
@keyframes popIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media (max-width:640px){
  .row{grid-template-columns:1fr 1fr}
  .row .nm{grid-column:1/-1}
  .row button{grid-column:1/-1}
  .stats{grid-template-columns:1fr 1fr}
  .totals b{font-size:17.5px}
  header h1{font-size:25px}
  .search-bar select{flex:1 1 100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="44" height="44">
          <circle cx="32" cy="32" r="22" fill="#F59E0B"/>
          <circle cx="32" cy="32" r="15" fill="none" stroke="#fff" stroke-width="2.6"/>
          <path d="M32 23v18M26.5 28c0-2.2 2.2-3.3 5.5-3.3s5.5 1.1 5.5 3.3-2.2 3.2-5.5 3.2-5.5 1-5.5 3.2 2.2 3.3 5.5 3.3 5.5-1.1 5.5-3.3" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>مصروفي</h1>
        <p>تابع مصروف كل ابن بدقة على جهازك: كم استلم، كم صرف، وكم باقي معه.</p>
      </div>
    </div>
    <div class="totals">
      <div><small>إجمالي المستلم</small><b id="tIn">0 ₪</b></div>
      <div><small>إجمالي المصروف</small><b id="tOut">0 ₪</b></div>
      <div><small>إجمالي الباقي</small><b id="tLeft">0 ₪</b></div>
    </div>
  </header>

  <div class="toolbar">
    <button class="primary" id="inst" hidden>تثبيت التطبيق</button>
    <button class="ghost" id="exp">نسخة احتياطية</button>
    <button class="ghost" id="imp">استرجاع نسخة</button>
    <input type="file" id="impf" accept="application/json,.json" hidden>
    <span class="spacer"></span>
    <button class="soft-btn" id="themeBtn" aria-label="تبديل المظهر">مظهر: تلقائي</button>
  </div>

  <section class="panel" aria-labelledby="addHeading">
    <h2 id="addHeading">إضافة ابن جديد</h2>
    <form id="addForm" class="row" novalidate>
      <div class="nm">
        <label for="name">الاسم</label>
        <input id="name" placeholder="مثال: أحمد" required maxlength="60">
      </div>
      <div>
        <label for="age">العمر</label>
        <input id="age" type="number" min="1" max="35" inputmode="numeric" placeholder="اختياري">
      </div>
      <div>
        <label for="allow">المصروف الشهري (₪)</label>
        <input id="allow" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
      </div>
      <button type="submit" class="primary" id="addKid">+ إضافة</button>
    </form>
  </section>

  <div class="search-bar" id="searchBar" hidden>
    <input id="searchInput" type="search" placeholder="ابحث باسم الابن..." aria-label="ابحث باسم الابن">
    <select id="sortKids" aria-label="ترتيب الأبناء">
      <option value="default">ترتيب الإضافة</option>
      <option value="name">الاسم (أ - ي)</option>
      <option value="left-desc">الأعلى رصيداً متبقياً</option>
      <option value="out-desc">الأعلى صرفاً</option>
    </select>
  </div>

  <main id="list"></main>
</div>

<!-- نافذة تسجيل استلام أو صرف -->
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dTitle"></h2>
    <div class="f">
      <label for="dAmt">المبلغ (₪)</label>
      <input id="dAmt" type="number" min="0.01" step="any" inputmode="decimal" required>
    </div>
    <div class="f" id="noteBox">
      <label for="dNote">على ماذا صرف؟ (اختياري)</label>
      <input id="dNote" placeholder="مثال: سندويش، دفتر، مواصلات" maxlength="100">
    </div>
    <div class="f">
      <label for="dDate" id="dDateL">التاريخ</label>
      <input id="dDate" type="date" required>
    </div>
    <div class="btns">
      <button type="button" class="ghost" id="dCancel">إلغاء</button>
      <button type="submit" id="dOk">حفظ</button>
    </div>
  </form>
</dialog>

<!-- نافذة تعديل بيانات الابن -->
<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h2>تعديل بيانات الابن</h2>
    <div class="f">
      <label for="eName">الاسم</label>
      <input id="eName" required maxlength="60">
    </div>
    <div class="f">
      <label for="eAge">العمر</label>
      <input id="eAge" type="number" min="0" max="35" inputmode="numeric">
    </div>
    <div class="f">
      <label for="eAllow">المصروف الشهري (₪)</label>
      <input id="eAllow" type="number" min="0" step="any" inputmode="decimal">
    </div>
    <div class="btns">
      <button type="button" class="ghost" id="eCancel">إلغاء</button>
      <button type="submit" class="primary">حفظ التعديلات</button>
    </div>
  </form>
</dialog>

<!-- نافذة تأكيد مخصصة -->
<dialog id="confirmDlg">
  <h2 id="cTitle">تأكيد</h2>
  <p class="sub" id="cMsg"></p>
  <div class="btns">
    <button type="button" class="ghost" id="cNo">إلغاء</button>
    <button type="button" class="red" id="cYes">تأكيد</button>
  </div>
</dialog>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script>
const STORAGE_KEY = 'kids-expenses-v1';
const THEME_KEY = 'masroufi-theme';
const COLORS = ['#2563EB','#059669','#D97706','#7C3AED','#DC2626','#0891B2'];

let kids = [];
let editingKidId = null;
let curTx = null;
let deferredPrompt = null;

const $ = id => document.getElementById(id);

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .25s';
    setTimeout(() => el.remove(), 260);
  }, 2400);
}

function askConfirm(title, msg, danger = true){
  return new Promise(resolve => {
    $('cTitle').textContent = title;
    $('cMsg').textContent = msg;
    $('cYes').className = danger ? 'red' : 'primary';
    const dlg = $('confirmDlg');
    const cleanup = ans => {
      dlg.removeEventListener('cancel', onCancel);
      $('cYes').onclick = null;
      $('cNo').onclick = null;
      dlg.close();
      resolve(ans);
    };
    const onCancel = e => { e.preventDefault(); cleanup(false); };
    dlg.addEventListener('cancel', onCancel);
    $('cYes').onclick = () => cleanup(true);
    $('cNo').onclick = () => cleanup(false);
    dlg.showModal();
  });
}

function openDB(){
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('no indexedDB'));
    const req = indexedDB.open('masroufi', 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains('s')) {
        req.result.createObjectStore('s');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function sanitizeKid(raw){
  if (!raw || typeof raw !== 'object') return null;
  const name = String(raw.name ?? '').trim();
  if (!name) return null;
  const age = Math.max(0, Math.min(35, Number(raw.age) || 0));
  const allow = Math.max(0, Number(raw.allow) || 0);
  const id = String(raw.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,6)));
  const log = Array.isArray(raw.log) ? raw.log.map((item, idx) => {
    if (!item || typeof item !== 'object') return null;
    const type = item.type === 'in' ? 'in' : (item.type === 'out' ? 'out' : null);
    const amt = Number(item.amt);
    if (!type || !(amt > 0) || !Number.isFinite(amt)) return null;
    const date = /^\d{4}-\d{2}-\d{2}$/.test(String(item.date || '')) ? String(item.date) : today();
    const note = String(item.note ?? '').trim().slice(0, 100);
    const seq = Number(item.seq) || (idx + 1);
    const txId = String(item.txId || (id + '-' + seq + '-' + Math.random().toString(36).slice(2,5)));
    return { txId, type, amt, date, note, seq };
  }).filter(Boolean) : [];
  return { id, name, age, allow, log };
}

async function loadData(){
  let loaded = null;
  try {
    const db = await openDB();
    loaded = await new Promise(resolve => {
      const tx = db.transaction('s', 'readonly');
      const req = tx.objectStore('s').get('kids');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  } catch (_) {}

  if (!Array.isArray(loaded)) {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (Array.isArray(raw)) loaded = raw;
    } catch (_) {}
  }

  kids = Array.isArray(loaded) ? loaded.map(sanitizeKid).filter(Boolean) : [];

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
}

async function saveData(){
  const snapshot = JSON.parse(JSON.stringify(kids));
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('s', 'readwrite');
      tx.objectStore('s').put(snapshot, 'kids');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (_) {}
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
  } catch (_) {}
}

const fmt = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('ar-EG') + ' ₪';
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const today = () => {
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
};
const sumType = (k, t) => k.log.filter(l => l.type === t).reduce((a, l) => a + l.amt, 0);
const dstr = d => {
  const parts = String(d).split('-');
  if (parts.length !== 3) return esc(d);
  const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (Number.isNaN(dt.getTime())) return esc(d);
  return dt.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
};

function compareLogs(a, b){
  const dc = String(b.date).localeCompare(String(a.date));
  if (dc !== 0) return dc;
  return (Number(b.seq) || 0) - (Number(a.seq) || 0);
}

function getFilteredKids(){
  const q = ($('searchInput').value || '').trim().toLowerCase();
  const sort = $('sortKids').value;
  let list = kids.map((k, idx) => ({ k, idx }));
  if (q) {
    list = list.filter(({ k }) => k.name.toLowerCase().includes(q));
  }
  if (sort === 'name') {
    list.sort((a, b) => a.k.name.localeCompare(b.k.name, 'ar'));
  } else if (sort === 'left-desc') {
    list.sort((a, b) => (sumType(b.k, 'in') - sumType(b.k, 'out')) - (sumType(a.k, 'in') - sumType(a.k, 'out')));
  } else if (sort === 'out-desc') {
    list.sort((a, b) => sumType(b.k, 'out') - sumType(a.k, 'out'));
  }
  return list;
}

function render(){
  let totalIn = 0, totalOut = 0;
  kids.forEach(k => {
    totalIn += sumType(k, 'in');
    totalOut += sumType(k, 'out');
  });

  $('tIn').textContent = fmt(totalIn);
  $('tOut').textContent = fmt(totalOut);
  const totalLeft = totalIn - totalOut;
  $('tLeft').textContent = fmt(totalLeft);
  $('tLeft').style.color = totalLeft < 0 ? '#FCA5A5' : '#fff';

  $('searchBar').hidden = kids.length < 2;

  const filtered = getFilteredKids();

  if (!kids.length) {
    $('list').innerHTML = '<div class="empty">لا يوجد أبناء مضافون بعد. أضف أول ابن من النموذج أعلاه للبدء.</div>';
    return;
  }
  if (!filtered.length) {
    $('list').innerHTML = '<div class="empty">لا توجد نتائج مطابقة لبحثك الحالي.</div>';
    return;
  }

  $('list').innerHTML = filtered.map(({ k, idx }) => {
    const inn = sumType(k, 'in');
    const out = sumType(k, 'out');
    const left = inn - out;
    const rawPct = inn > 0 ? (out / inn) * 100 : (out > 0 ? 100 : 0);
    const barPct = Math.min(100, Math.max(0, rawPct));
    const barColor = rawPct > 85 ? 'var(--bad)' : (rawPct > 60 ? 'var(--warn)' : 'var(--good)');

    const lastIn = [...k.log].filter(l => l.type === 'in').sort(compareLogs)[0];
    const sortedLogs = [...k.log].sort(compareLogs);

    const logsHtml = sortedLogs.map(l => {
      const label = l.type === 'in' ? 'استلام مصروف' : esc(l.note || 'صرف مصروف');
      const sign = l.type === 'in' ? '+' : '−';
      return `<div class="log" data-log-type="${l.type}">
        <div class="log-main">
          <span class="log-title">${label}</span>
          <span class="log-date">${dstr(l.date)}</span>
        </div>
        <div class="log-right">
          <span class="${l.type}">${sign} ${fmt(l.amt)}</span>
          <button type="button" class="log-del" data-del-tx="${k.id}" data-tx-id="${l.txId}" aria-label="حذف الحركة" title="حذف الحركة">✕</button>
        </div>
      </div>`;
    }).join('');

    const avatarChar = esc([...k.name.trim()][0] || '؟');
    const ageText = k.age ? `${k.age} سنة · ` : '';
    const allowText = k.allow ? `المصروف الشهري ${fmt(k.allow)}` : 'بدون مصروف شهري ثابت';

    return `<article class="card" data-kid-card="${k.id}">
      <div class="top">
        <div class="av" style="background:${COLORS[idx % COLORS.length]}">${avatarChar}</div>
        <div class="top-info">
          <h3>${esc(k.name)}</h3>
          <span>${ageText}${allowText}</span>
        </div>
        <div class="top-actions">
          <button type="button" class="icon-btn" data-edit="${k.id}" aria-label="تعديل ${esc(k.name)}">تعديل</button>
          <button type="button" class="icon-btn danger" data-del="${k.id}" aria-label="حذف ${esc(k.name)}">حذف</button>
        </div>
      </div>

      <div class="stats">
        <div><small>المستلم</small><b>${fmt(inn)}</b></div>
        <div><small>آخر استلام</small><b style="font-size:14.5px">${lastIn ? dstr(lastIn.date) : '—'}</b></div>
        <div><small>المصروف</small><b class="out">${fmt(out)}</b></div>
        <div><small>الباقي</small><b class="${left < 0 ? 'out' : 'in'}">${fmt(left)}</b></div>
      </div>

      <div class="bar-wrap">
        <div class="bar" title="نسبة المصروف من المستلم">
          <i style="width:${barPct}%;background:${barColor}"></i>
        </div>
        <span class="pct-label">${Math.round(rawPct)}%</span>
      </div>

      <div class="acts">
        <button type="button" class="green" data-act="in" data-id="${k.id}">+ استلام مصروف</button>
        <button type="button" class="red" data-act="out" data-id="${k.id}">− تسجيل صرف</button>
      </div>

      ${k.log.length ? `
        <details>
          <summary>
            <span>سجل الحركات (${k.log.length})</span>
            <span style="font-size:12.5px;color:var(--muted)">عرض / إخفاء</span>
          </summary>
          <div class="log-controls">
            <select class="log-filter" data-kid-filter="${k.id}" aria-label="فلترة حركات ${esc(k.name)}">
              <option value="all">كل الحركات</option>
              <option value="in">الاستلام فقط</option>
              <option value="out">الصرف فقط</option>
            </select>
          </div>
          <div class="logs-list">${logsHtml}</div>
        </details>` : ''}
    </article>`;
  }).join('');
}

$('addForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!name) {
    $('name').focus();
    showToast('يرجى إدخال اسم الابن');
    return;
  }
  const age = Math.max(0, Math.min(35, Number($('age').value) || 0));
  const allow = Math.max(0, Number($('allow').value) || 0);
  kids.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    name,
    age,
    allow,
    log: []
  });
  $('addForm').reset();
  $('name').focus();
  await saveData();
  render();
  showToast(`تمت إضافة ${name}`);
};

$('searchInput').oninput = render;
$('sortKids').onchange = render;

$('list').onchange = e => {
  const sel = e.target.closest('.log-filter');
  if (!sel) return;
  const card = sel.closest('.card');
  const val = sel.value;
  card.querySelectorAll('.logs-list .log').forEach(row => {
    const t = row.dataset.logType;
    row.style.display = (val === 'all' || val === t) ? '' : 'none';
  });
};

$('list').onclick = async e => {
  const delTxBtn = e.target.closest('[data-del-tx]');
  if (delTxBtn) {
    const kid = kids.find(x => x.id === delTxBtn.dataset.delTx);
    if (!kid) return;
    const ok = await askConfirm('حذف الحركة', 'هل تريد حذف هذه الحركة من السجل؟');
    if (!ok) return;
    kid.log = kid.log.filter(l => l.txId !== delTxBtn.dataset.txId);
    await saveData();
    render();
    showToast('تم حذف الحركة');
    return;
  }

  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    const kid = kids.find(x => x.id === editBtn.dataset.edit);
    if (!kid) return;
    editingKidId = kid.id;
    $('eName').value = kid.name;
    $('eAge').value = kid.age || '';
    $('eAllow').value = kid.allow || '';
    $('editDlg').showModal();
    $('eName').focus();
    return;
  }

  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    const kid = kids.find(x => x.id === delBtn.dataset.del);
    if (!kid) return;
    const ok = await askConfirm('حذف الابن', `هل أنت متأكد من حذف "${kid.name}" وكل سجلاته؟`);
    if (!ok) return;
    kids = kids.filter(x => x.id !== kid.id);
    await saveData();
    render();
    showToast(`تم حذف ${kid.name}`);
    return;
  }

  const actBtn = e.target.closest('[data-act]');
  if (!actBtn) return;
  const kid = kids.find(x => x.id === actBtn.dataset.id);
  if (!kid) return;
  curTx = { kid, type: actBtn.dataset.act };
  $('dTitle').textContent = (curTx.type === 'in' ? 'استلام مصروف — ' : 'تسجيل صرف — ') + kid.name;
  $('noteBox').style.display = curTx.type === 'out' ? 'block' : 'none';
  $('dDateL').textContent = curTx.type === 'in' ? 'تاريخ الاستلام' : 'تاريخ الصرف';
  $('dAmt').value = curTx.type === 'in' && kid.allow > 0 ? kid.allow : '';
  $('dNote').value = '';
  $('dDate').value = today();
  $('dOk').className = curTx.type === 'in' ? 'green' : 'red';
  $('dOk').textContent = curTx.type === 'in' ? 'تأكيد الاستلام' : 'تأكيد الصرف';
  $('dlg').showModal();
  $('dAmt').focus();
};

$('dCancel').onclick = () => $('dlg').close();
$('dlgForm').onsubmit = async e => {
  e.preventDefault();
  if (!curTx) return;
  const amt = Number($('dAmt').value);
  if (!(amt > 0) || !Number.isFinite(amt)) {
    $('dAmt').focus();
    showToast('أدخل مبلغاً أكبر من صفر');
    return;
  }
  const dateVal = /^\d{4}-\d{2}-\d{2}$/.test($('dDate').value) ? $('dDate').value : today();
  const noteVal = curTx.type === 'out' ? $('dNote').value.trim().slice(0, 100) : '';
  const maxSeq = curTx.kid.log.reduce((m, l) => Math.max(m, Number(l.seq) || 0), 0);
  curTx.kid.log.push({
    txId: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    type: curTx.type,
    amt,
    date: dateVal,
    note: noteVal,
    seq: maxSeq + 1
  });
  $('dlg').close();
  await saveData();
  render();
  showToast(curTx.type === 'in' ? 'تم تسجيل الاستلام' : 'تم تسجيل الصرف');
  curTx = null;
};

$('eCancel').onclick = () => $('editDlg').close();
$('editForm').onsubmit = async e => {
  e.preventDefault();
  const kid = kids.find(x => x.id === editingKidId);
  if (!kid) return;
  const newName = $('eName').value.trim();
  if (!newName) {
    $('eName').focus();
    return;
  }
  kid.name = newName;
  kid.age = Math.max(0, Math.min(35, Number($('eAge').value) || 0));
  kid.allow = Math.max(0, Number($('eAllow').value) || 0);
  $('editDlg').close();
  editingKidId = null;
  await saveData();
  render();
  showToast('تم تحديث البيانات');
};

$('exp').onclick = () => {
  const payload = JSON.stringify({ app: 'masroufi', version: 1, exportedAt: new Date().toISOString(), kids }, null, 2);
  const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'masroufi-backup-' + today() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('تم تصدير النسخة الاحتياطية');
};

$('imp').onclick = () => $('impf').click();
$('impf').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const rawList = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.kids) ? parsed.kids : null);
    if (!rawList) {
      showToast('بنية ملف النسخة الاحتياطية غير صالحة');
      return;
    }
    const cleanKids = rawList.map(sanitizeKid).filter(Boolean);
    if (!cleanKids.length && rawList.length > 0) {
      showToast('لم يتم العثور على سجلات صالحة في الملف');
      return;
    }
    const ok = await askConfirm('استرجاع نسخة احتياطية', 'سيتم استبدال البيانات الحالية ببيانات النسخة المحددة. هل تريد المتابعة؟', false);
    if (!ok) return;
    kids = cleanKids;
    await saveData();
    render();
    showToast('تم استرجاع البيانات بنجاح');
  } catch (_) {
    showToast('تعذر قراءة الملف، تأكد أنه ملف JSON صحيح');
  }
};

const THEMES = ['auto', 'light', 'dark'];
const THEME_LABELS = { auto: 'مظهر: تلقائي', light: 'مظهر: فاتح', dark: 'مظهر: داكن' };
function applyTheme(mode){
  const valid = THEMES.includes(mode) ? mode : 'auto';
  try { localStorage.setItem(THEME_KEY, valid); } catch (_) {}
  if (valid === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', valid);
  }
  $('themeBtn').textContent = THEME_LABELS[valid];
}
$('themeBtn').onclick = () => {
  const cur = localStorage.getItem(THEME_KEY) || 'auto';
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  applyTheme(next);
};

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  $('inst').hidden = false;
});
$('inst').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $('inst').hidden = true;
};
window.addEventListener('appinstalled', () => {
  $('inst').hidden = true;
  showToast('تم تثبيت مصروفي على جهازك');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

applyTheme((() => { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (_) { return 'auto'; } })());
loadData().then(render);
</script>
</body>
</html>
